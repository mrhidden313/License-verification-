<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ARMS LICENSE VERIFICATION</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            padding: 0px;
            justify-content: center;
            align-items: flex-start;
            margin-top: 0px;
            min-height: 8vh;
            max-height: 1vh;
            transform: scale(0.6);

            
        }
        .verification-card {
            text-align: center;
    border-radius: 10px;
    width: 100%;
    background: white;
    padding: 0px 10px 10px 10px;
    margin: 0px 0px 0px -10px;
        }
        .logo-img {
        margin: 0 auto;
       width: 80px;
       height: 80px;
       margin-bottom: 8px;
       
        }
        h1 {
             text-align:center;
             font-size: 21px; 
             color:#141414;
             font-family: Verdana;
             width: 100%;
            font-weight: bolder;
        padding: 0;
        margin: 10px;
        }
       
        .search-area p { 
            font-size:18px;
             margin-bottom:10px;
             font-weight:bold;
             margin-top: 50px;
             
             }
        .search-form { display:flex; flex-direction:column; gap:10px; align-items:center; }
        .search-input {
            width:65%; padding:10px; border:1px solid #99a7b4; border-radius:4px;
            text-align:center; font-size:1rem;
        }
        .submit-btn {
            padding:10px 10px 10px 10px; 
            background:#16996f;
             color:#fff; 
             border:none; 
             border-radius:4px;
            width:14vh;
            margin-bottom: 5px;
             cursor:pointer; font-size:1rem;
        }
        .result-box {
          border-radius:5px; 
          padding:15px;
           margin-top:20px; 
           background:#fff; 
           display:none; 
        }
        .result-item { 
            display:flex;
             justify-content:space-between;
              padding:8px 0;
              
                font-size:1rem; 
            }

        .result-item:last-child { border-bottom:none; }

        .result-label { 
            color:#555;
             flex-basis:45%;
             }

        .result-value { font-weight:bold;
             color:#000; 
             text-align:right;
              flex-basis:55%;
             }
       
       .container {
    max-width: 650px;
    width: 100%;
    padding: 30px;
    border-radius: 10px;
    margin-top: 0px;
    box-sizing: border-box;
    display: flex;
    text-align: center;
    flex-direction: column;
    justify-content: center;
}

.search-area {
    text-align: center;
    border: 1px solid rgb(206, 205, 205);
    border-radius: 10px;
    box-shadow: 0 0 1px 1px rgb(248, 247, 247);
    width: 100%;
    background: white;
    padding: 10px;
    margin: 10px auto;
}
 
  
       
    </style>
</head>
<body style="padding: 0; margin: 0px;">
    
    <div class="container">
        <div class="img">
    </div>
    <div class="verification-card">
    <img src="logo.png" alt="Pakistan Emblem" class="logo-img">

        <h1>ARMS LICENSE VERIFICATION</h1>
    
        <div class="search-area">
            <p>Search By CNIC with dashes</p>
            <form class="search-form" id="searchForm">
                <input type="text" id="cnicInput" class="search-input" placeholder="1234512345671" maxlength="15" required>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
            <div class="result-box" id="resultBox">
            <div class="result-item"><span class="result-label">Applicant Name:</span> <span class="result-value" id="rName">N/A</span></div>
            <div class="result-item"><span class="result-label">Father Name:</span> <span class="result-value" id="rFather">N/A</span></div>
            <div class="result-item"><span class="result-label">License No.:</span> <span class="result-value" id="rLicense">N/A</span></div>
            <div class="result-item"><span class="result-label">Weapon Type:</span> <span class="result-value" id="rWeapon">N/A</span></div>
            <div class="result-item"><span class="result-label">Caliber:</span> <span class="result-value" id="rCaliber">N/A</span></div>
            <div class="result-item"><span class="result-label">Weapon No.:</span> <span class="result-value" id="rWeaponNo">N/A</span></div>
            <div class="result-item"><span class="result-label">Cartridges:</span> <span class="result-value" id="rCart">N/A</span></div>
            <div class="result-item"><span class="result-label">Status:</span> <span class="result-value" id="rStatus">N/A</span></div>
            <div class="result-item"><span class="result-label">Issue Date:</span> <span class="result-value" id="rIssue">N/A</span></div>
            <div class="result-item"><span class="result-label">Expiry Date:</span> <span class="result-value" id="rExpiry">N/A</span></div>
        </div>
    </div>
        </div>

    </div>    

<script>
document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    // get user input and normalize to digits-only for comparison
    const cnicRaw = document.getElementById('cnicInput').value || '';
    const cnicDigits = cnicRaw.replace(/\D/g, '').trim();

    if (!/^\d{13}$/.test(cnicDigits)) {
        alert('Please enter exactly 13 digits for CNIC (no dashes).');
        return;
    }

    const box = document.getElementById('resultBox');
    box.style.display = 'block';

    try {
        // ---- put your raw GitHub link here if you use GitHub ----
        const res = await fetch("details.txt");
        const text = await res.text();

        const lines = text.split(/\r?\n/);
        let found = false;

        for (let rawLine of lines) {
            if (!rawLine || !rawLine.trim()) continue;

            // split with optional spaces around pipes (robust)
            const parts = rawLine.split(/\s*\|\s*/);

            // if first part missing, try to continue
            if (parts.length === 0) continue;

            // normalize ID: remove non-digits
            const id = (parts[0] || '').replace(/\D/g, '').trim();

            // compare digits-only CNICs
            if (id && id === cnicDigits) {
                // map fields safely, fill missing with 'N/A'
                const get = i => (parts[i] || '').trim() || 'N/A';

                document.getElementById('rName').textContent = get(1);
                document.getElementById('rFather').textContent = get(2);
                document.getElementById('rLicense').textContent = get(3);
                document.getElementById('rWeapon').textContent = get(4);
                document.getElementById('rCaliber').textContent = get(5);
                document.getElementById('rWeaponNo').textContent = get(6);
                document.getElementById('rCart').textContent = get(7);
                document.getElementById('rStatus').textContent = get(8);
                document.getElementById('rIssue').textContent = get(9);
                document.getElementById('rExpiry').textContent = get(10);

                found = true;
                break;
            }
        }

        if (!found) {
            document.querySelectorAll('.result-value').forEach(e => e.textContent = 'N/A');
        }
    } catch (err) {
        console.error('Fetch/parse error:', err);
        document.querySelectorAll('.result-value').forEach(e => e.textContent = 'N/A');
    }
});
</script>

</body>
    </html>
